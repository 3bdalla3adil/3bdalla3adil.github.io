name: Deploy Portfolio Website

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate entry file
        run: |
          test -f index.html

      # 🛠️ INJECT THE SINGLE FIREBASE_CONFIG JSON STRING
      - name: Inject Firebase Configuration
        env:
          CONFIG_DATA: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Creates a script payload using your JSON secret string
          INJECTION_SCRIPT="<script>window.env = { FIREBASE_CONFIG: $CONFIG_DATA };</script></head>"
          # Safely injects the script right before the closing </head> tag inside index.html
          sed -i "s|<\/head>|${INJECTION_SCRIPT}|g" index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
