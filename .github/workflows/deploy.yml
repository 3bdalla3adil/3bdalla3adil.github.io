name: Deploy Portfolio Website

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate entry file
        run: |
          test -f index.html

      # This site is static HTML/CSS/JS. Never inject secrets into public client-side files.
      # Contact submissions are handled by the configured external form provider.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: GitHub Workflow Cleaner Action
        uses: rokibhasansagar/slimhub_actions@v25.42.5
