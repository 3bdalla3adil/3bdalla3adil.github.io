name: Validate portfolio

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'data/**'
      - '.pages.yml'
      - 'scripts/validate-portfolio.mjs'
      - '.github/workflows/portfolio-validation.yml'
  pull_request:
    branches: [master]
    paths:
      - 'index.html'
      - 'data/**'
      - '.pages.yml'
      - 'scripts/validate-portfolio.mjs'
      - '.github/workflows/portfolio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate content, links and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portfolio
        run: node scripts/validate-portfolio.mjs
