media:
  input: assets/img
  output: /assets/img

content:
  - name: projects
    label: Portfolio projects
    type: file
    path: data/portfolio-projects.json
    format: json
    list: true
    fields:
      - name: id
        label: Unique ID
        type: string
        required: true
      - name: title
        label: Project title (English)
        type: string
        required: true
      - name: titleAr
        label: Project title (Arabic)
        type: string
      - name: description
        label: Description (English)
        type: text
        required: true
      - name: descriptionAr
        label: Description (Arabic)
        type: text
      - name: category
        label: Category
        type: string
      - name: techLine
        label: Technology summary
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Cover image
        type: image
      - name: link
        label: Project or case-study URL
        type: string
      - name: linkLabel
        label: Link button (English)
        type: string
      - name: linkLabelAr
        label: Link button (Arabic)
        type: string
      - name: featured
        label: Feature on portfolio
        type: boolean

  - name: site
    label: Site settings
    type: file
    path: data/site-settings.json
    format: json
    fields:
      - name: title
        label: Site title
        type: string
      - name: description
        label: SEO description
        type: text
      - name: contactEmail
        label: Contact email
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: github
        label: GitHub URL
        type: string

  - name: caseStudies
    label: Case studies
    type: file
    path: data/case-studies.json
    format: json
    list: true
    fields:
      - name: id
        label: Unique ID
        type: string
        required: true
      - name: title
        label: Title (English)
        type: string
        required: true
      - name: titleAr
        label: Title (Arabic)
        type: string
      - name: summary
        label: Summary (English)
        type: text
        required: true
      - name: summaryAr
        label: Summary (Arabic)
        type: text
      - name: challenge
        label: Challenge
        type: text
      - name: solution
        label: Solution
        type: text
      - name: outcome
        label: Outcome (English)
        type: text
      - name: outcomeAr
        label: Outcome (Arabic)
        type: text
      - name: category
        label: Category
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: link
        label: Related project URL
        type: string
      - name: image
        label: Cover image
        type: image

settings:
  content:
    merge: true
